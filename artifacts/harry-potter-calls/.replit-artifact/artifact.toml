kind = "web"
previewPath = "/"
title = "Hogwarts Video Calls"
version = "1.0.0"
id = "artifacts/harry-potter-calls"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25594

[services.development]
run = "pnpm --filter @workspace/harry-potter-calls run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/harry-potter-calls", "run", "build" ]
publicDir = "artifacts/harry-potter-calls/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25594"
BASE_PATH = "/"
