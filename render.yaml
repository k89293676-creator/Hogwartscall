services:
  - type: web
    name: hogwarts-floo-network
    env: node
    region: oregon
    plan: free
    autoDeploy: true
    branch: main

    nodeVersion: "20"

    buildCommand: >
      npm install -g pnpm@9 --prefer-offline &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/harry-potter-calls run build &&
      pnpm --filter @workspace/api-server run build

    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    buildFilter:
      paths:
        - artifacts/harry-potter-calls/src/**
        - artifacts/harry-potter-calls/public/**
        - artifacts/harry-potter-calls/index.html
        - artifacts/harry-potter-calls/vite.config.ts
        - artifacts/harry-potter-calls/package.json
        - artifacts/harry-potter-calls/tsconfig.json
        - artifacts/api-server/src/**
        - artifacts/api-server/build.mjs
        - artifacts/api-server/package.json
        - artifacts/api-server/tsconfig.json
        - lib/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://hogwarts-floo-network.onrender.com
      - key: VITE_SOCKET_URL
        value: https://hogwarts-floo-network.onrender.com
      - key: VITE_TURN_URL
        value: turn:openrelay.metered.ca:80
      - key: VITE_TURN_USER
        value: openrelayproject
      - key: VITE_TURN_CRED
        value: openrelayproject
